<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <!-- Test uchun umumiy portret: haqiqiy odam emas -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3E6D8"/>
      <stop offset="1" stop-color="#D9BFA6"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.28" r="0.6">
      <stop offset="0" stop-color="#FFF8EE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFF8EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="curtainL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7D2318"/>
      <stop offset="1" stop-color="#A63A2B"/>
    </linearGradient>
    <linearGradient id="curtainR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#7D2318"/>
      <stop offset="1" stop-color="#A63A2B"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3330"/>
      <stop offset="1" stop-color="#1E1A18"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A413D"/>
      <stop offset="1" stop-color="#2A2421"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#spot)"/>

  <!-- sahna pardasi -->
  <path d="M0 0 H150 C130 200 160 420 120 1000 H0 Z" fill="url(#curtainL)"/>
  <path d="M40 0 V1000 M85 0 C80 300 95 600 70 1000" stroke="#5E1A12" stroke-opacity="0.35" stroke-width="6" fill="none"/>
  <path d="M800 0 H650 C670 200 640 420 680 1000 H800 Z" fill="url(#curtainR)"/>
  <path d="M760 0 V1000 M715 0 C720 300 705 600 730 1000" stroke="#5E1A12" stroke-opacity="0.35" stroke-width="6" fill="none"/>
  <path d="M0 0 H800 V70 C600 110 200 110 0 70 Z" fill="#7D2318"/>
  <path d="M0 70 C200 110 600 110 800 70" stroke="#C28A27" stroke-width="6" fill="none"/>

  <!-- siluet: yelka va bosh -->
  <path d="M170 1000 C175 840 250 760 400 745 C550 760 625 840 630 1000 Z" fill="url(#body)"/>
  <path d="M345 700 H455 V770 C430 800 370 800 345 770 Z" fill="#2E2825"/>
  <ellipse cx="400" cy="540" rx="128" ry="160" fill="url(#head)"/>
  <!-- yorug'lik qirrasi -->
  <path d="M300 470 C320 410 360 385 400 382" stroke="#FFF3E2" stroke-opacity="0.25" stroke-width="10" stroke-linecap="round" fill="none"/>
  <!-- ko'ylak yoqasi -->
  <path d="M360 760 L400 840 L440 760" stroke="#C28A27" stroke-width="8" fill="none" stroke-linejoin="round"/>
</svg>
